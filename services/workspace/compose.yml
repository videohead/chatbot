name: ${CHATBOT_WORKSPACE_COMPOSE_PROJECT:-chatbot-workspace}

services:
  workspace:
    build:
      context: .
    image: ${CHATBOT_WORKSPACE_IMAGE:-chatbot-workspace:blechdom}
    container_name: ${CHATBOT_WORKSPACE_CONTAINER:-chatbot-workspace-blechdom}
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    environment:
      TOOLS_SERVICE_KIND: workspace
      TOOLS_SERVICE_ID: workspace-blechdom
      TOOLS_POLICY_FILE: /run/secrets/policy.json
      TOOLS_SHARED_SECRET_FILE: /run/secrets/token
      WORKSPACE_PERSONAL_FILES: "true"
    volumes:
      - ${CHATBOT_CREATIVE_DIR:?set CHATBOT_CREATIVE_DIR}:/workspace/creative:rw
      - ${CHATBOT_NVIDIA_DIR:?set CHATBOT_NVIDIA_DIR}:/workspace/nvidia:rw
      - ${CHATBOT_WORKSPACE_STATE_DIR:?set CHATBOT_WORKSPACE_STATE_DIR}:/data
      - ${CHATBOT_WORKSPACE_POLICY_FILE:?set CHATBOT_WORKSPACE_POLICY_FILE}:/run/secrets/policy.json:ro
      - ${CHATBOT_WORKSPACE_TOKEN_FILE:?set CHATBOT_WORKSPACE_TOKEN_FILE}:/run/secrets/token:ro
      - ${CHATBOT_GITHUB_TOKEN_FILE:?set CHATBOT_GITHUB_TOKEN_FILE}:/run/secrets/github.token:ro
      - ${CHATBOT_GITLAB_TOKEN_FILE:?set CHATBOT_GITLAB_TOKEN_FILE}:/run/secrets/gitlab.token:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - metis-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 3s

networks:
  metis-network:
    external: true
