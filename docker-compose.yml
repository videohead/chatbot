services:
  openharness-chat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    image: openharness-chat:latest
    container_name: openharness-chat
    env_file:
      - /opt/openharness/.env
      - /opt/openharness-chat/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:15000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - POSTGRES_URL=postgresql://openharness:openharness_pass@openharness-postgres:5432/openharness_db
      # db 0 holds openharness job state; chat streams are isolated on db 1.
      - REDIS_URL=redis://openharness-redis:6379/1
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://videohead.duckdns.org/vllm/v1}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-http://10.0.0.105:11434/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-not-needed}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-oss-20b}
      - OPENHARNESS_CONTEXT_WINDOW_TOKENS=${OPENHARNESS_CONTEXT_WINDOW_TOKENS:-131072}
      - OPENHARNESS_AUTO_COMPACT_THRESHOLD_TOKENS=${OPENHARNESS_AUTO_COMPACT_THRESHOLD_TOKENS:-106496}
      - OPENHARNESS_MAX_OUTPUT_TOKENS=${OPENHARNESS_MAX_OUTPUT_TOKENS:-8192}
      - OPENHARNESS_CONTEXT_OVERHEAD_TOKENS=${OPENHARNESS_CONTEXT_OVERHEAD_TOKENS:-98304}
      - OPENHARNESS_CONTEXT_SAFETY_MARGIN_TOKENS=${OPENHARNESS_CONTEXT_SAFETY_MARGIN_TOKENS:-20480}
      - OPENHARNESS_MAX_CONTEXT_INPUT_TOKENS=${OPENHARNESS_MAX_CONTEXT_INPUT_TOKENS:-8192}
      - OPENHARNESS_CONTEXT_DUMP_PROMPT_CHARS=${OPENHARNESS_CONTEXT_DUMP_PROMPT_CHARS:-2048}
      - OPENHARNESS_SESSION_RAG_ENABLED=${OPENHARNESS_SESSION_RAG_ENABLED:-true}
      - OPENHARNESS_SESSION_RAG_PROMPT_CHARS=${OPENHARNESS_SESSION_RAG_PROMPT_CHARS:-4096}
      - OPENHARNESS_SESSION_RAG_CHUNK_CHARS=${OPENHARNESS_SESSION_RAG_CHUNK_CHARS:-6000}
      - OPENHARNESS_SESSION_RAG_CHUNK_OVERLAP_CHARS=${OPENHARNESS_SESSION_RAG_CHUNK_OVERLAP_CHARS:-600}
      - OPENHARNESS_SESSION_RAG_EMBEDDING_DIMENSIONS=${OPENHARNESS_SESSION_RAG_EMBEDDING_DIMENSIONS:-1536}
      - OPENHARNESS_EMBEDDING_BASE_URL=${OPENHARNESS_EMBEDDING_BASE_URL:-}
      - OPENHARNESS_EMBEDDING_MODEL=${OPENHARNESS_EMBEDDING_MODEL:-}
      - OPENHARNESS_EMBEDDING_API_KEY=${OPENHARNESS_EMBEDDING_API_KEY:-not-needed}
      - OPENHARNESS_TOOL_OUTPUT_KEEP_RECENT=${OPENHARNESS_TOOL_OUTPUT_KEEP_RECENT:-0}
      - OPENHARNESS_TOOL_OUTPUT_MAX_CHARS=${OPENHARNESS_TOOL_OUTPUT_MAX_CHARS:-1024}
      - MAX_AGENT_STEPS=${MAX_AGENT_STEPS:-100}
      - MAX_MESSAGES_PER_HOUR=${MAX_MESSAGES_PER_HOUR:-1000000}
      - MAX_MESSAGES_PER_IP_PER_HOUR=${MAX_MESSAGES_PER_IP_PER_HOUR:-1000000}
      - MAX_REQUEST_DURATION_SECONDS=${MAX_REQUEST_DURATION_SECONDS:-3600}
      - METIS_MCP_URL=${METIS_MCP_URL:-http://metis-server:9999/mcp}
      - UPLOAD_DIR=/data/uploads
      - MAX_AGENT_STEPS=${MAX_AGENT_STEPS:-25}
    volumes:
      - openharness-chat-uploads:/data/uploads
      - /opt:/opt
      - /etc/passwd:/etc/passwd:ro
    extra_hosts:
      - "videohead.duckdns.org:host-gateway"
      - "host.docker.internal:host-gateway"
    networks:
      - metis-network

networks:
  metis-network:
    name: metis-network
    external: true

volumes:
  openharness-chat-uploads:
