name: chatbot

services:
  web:
    build:
      context: .
      dockerfile: deploy/production/Dockerfile
    image: local/chatbot:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AGENT_FRAMEWORK_URL: http://agent-framework:8000
      AUTH_SECRET_FILE: /run/secrets/chatbot-auth-secret
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://videohead.duckdns.org
      CHATBOT_DEPLOYMENT_LABEL: production
      CHATBOT_ENABLE_DIRECT_MCP_TOOLS: "false"
      NEXT_PUBLIC_DEFAULT_CHAT_MODEL: "nvidia/nvidia/llama-3.3-nemotron-super-49b-v1"
      CHATBOT_MEDIA_ROOT: /app/media
      CHATBOT_MEMORY_ENABLED: "true"
      CHATBOT_LOG_BODIES: "false"
      CHATBOT_LOG_DIR: /app/logs
      CHATBOT_LOG_LEVEL: info
      CHATBOT_POSTGRES_DATABASE: chatbot
      CHATBOT_POSTGRES_HOST: litellm_db
      CHATBOT_POSTGRES_PASSWORD_FILE: /run/secrets/chatbot-postgres-password
      CHATBOT_POSTGRES_PORT: "5432"
      CHATBOT_POSTGRES_USER: chatbot_app
      CHATBOT_WORKSPACE_ENABLED: "false"
      LITELLM_API_KEY_FILE: /run/secrets/litellm-client-key
      LITELLM_BASE_URL: http://litellm:4000/v1
      LOG_LEVEL: info
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    secrets:
      - chatbot-auth-secret
      - chatbot-postgres-password
      - litellm-client-key
    volumes:
      - type: bind
        source: /opt/chatbot/logs
        target: /app/logs
        bind:
          create_host_path: false
      - type: bind
        source: /opt/ComfyUI/output/chatbot
        target: /app/media
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/auth/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    logging:
      driver: local
      options:
        max-file: "5"
        max-size: 25m
    networks:
      - default
      - metis-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.next/cache:size=256m,uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true

secrets:
  chatbot-auth-secret:
    file: /etc/chatbot/secrets/auth-secret
  chatbot-postgres-password:
    file: /etc/chatbot/secrets/postgres-password
  litellm-client-key:
    file: /etc/chatbot/secrets/litellm-client.key

networks:
  metis-network:
    external: true
